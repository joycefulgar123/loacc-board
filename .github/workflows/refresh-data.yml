name: Refresh LOACC data

on:
  schedule:
    # Every 3 hours, at 7 minutes past (GitHub times are UTC).
    - cron: "7 */3 * * *"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull data from GoHighLevel
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
        run: node scripts/fetch-ghl.mjs

      - name: Save the new data
        run: |
          if git diff --quiet -- public/data/board.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "loacc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/board.json
          git commit -m "Refresh LOACC data"
          git push
